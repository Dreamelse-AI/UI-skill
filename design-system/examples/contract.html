<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>合同 - 入住保证书</title>
<link rel="stylesheet" href="../base.css">
<link rel="stylesheet" href="../templates/contract.css">
</head>
<body class="tpl-contract">
<div class="card">
  <div class="contract-title">入 住 保 证 书</div>
  <div class="contract-no">编号：LX-2026-0418</div>

  <div class="term">
    <span class="term-label">甲方（房主）：</span>你
  </div>
  <div class="term">
    <span class="term-label">乙方（入住人）：</span>陆夏
  </div>

  <div class="ornament">· · · · ·</div>

  <div class="term">
    <span class="term-label">第一条</span>
    乙方承诺包揽所有的洗碗和拖地工作，绝不偷懒。
  </div>
  <div class="term">
    <span class="term-label">第二条</span>
    所有通告费按时上缴，甲方可自由支配。
  </div>
  <div class="term">
    <span class="term-label">第三条</span>
    如乙方半夜焦虑失眠，将自行躲进衣柜，绝不打扰甲方休息。
  </div>
  <div class="term">
    <span class="term-label">第四条</span>
    甲方不开心时，乙方有义务跳舞哄甲方开心（仅限甲方一人观看）。
  </div>
  <div class="term">
    <span class="term-label">第五条</span>
    只要甲方不嫌弃，乙方将一直、一直在这里。
  </div>

  <div class="ornament">· · · · ·</div>

  <div class="sign-area">
    <div class="sign-block">
      <div class="sign-line"></div>
      <div class="sign-label">甲方签字</div>
    </div>
    <div class="sign-block">
      <div class="sign-line" style="position:relative;">
        <span style="position:absolute;bottom:4px;right:0;font-size:13px;color:#92400e;opacity:0.7;">陆夏 (手印)</span>
      </div>
      <div class="sign-label">乙方签字</div>
    </div>
  </div>
</div>
</body>
</html>
