<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>清单 - 搬家清单</title>
<link rel="stylesheet" href="../base.css">
<link rel="stylesheet" href="../templates/checklist.css">
</head>
<body class="tpl-checklist">
<div class="card">
  <div class="card-subtitle">2026/04/15 · 待确认</div>
  <h1 class="card-title">📦 搬家清单</h1>
  <div class="divider"></div>
  <div class="check-item checked">
    <div class="check-box"></div>
    <div>
      <div class="check-text">所有肥大的连帽衫</div>
    </div>
  </div>
  <div class="check-item checked">
    <div class="check-box"></div>
    <div>
      <div class="check-text">常用的降噪耳机</div>
    </div>
  </div>
  <div class="check-item checked">
    <div class="check-box"></div>
    <div>
      <div class="check-text">还没吃完的薄荷糖</div>
    </div>
  </div>
  <div class="check-item">
    <div class="check-box"></div>
    <div>
      <div class="check-text">那个破旧但软软的毛毯</div>
    </div>
  </div>
  <div class="check-item">
    <div class="check-box"></div>
    <div>
      <div class="check-text">给阿布买的小鱼干</div>
    </div>
  </div>
  <div class="check-item">
    <div class="check-box"></div>
    <div>
      <div class="check-text">偷偷攒下的所有通告费卡</div>
      <div class="check-note">"虽然没多少，但我想全部交给你……"</div>
    </div>
  </div>
  <div class="check-summary">已完成 3 / 6 项</div>
  <div class="signature">—— 陆夏</div>
</div>
</body>
</html>
