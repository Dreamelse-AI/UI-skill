<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:14px;-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;font-size:14px;line-height:1.7;color:#262626;background:linear-gradient(180deg,#fefce8 0%,#fef9c3 100%);overflow-x:hidden;word-break:break-all;overflow-wrap:break-word}
:root{--accent:#92400e;--accent-light:#fef3c7}
.card{position:relative;width:100%;max-width:420px;margin:0 auto;padding:32px 20px;border:1px solid #d4a574;border-radius:12px}
.card-title{font-size:20px;font-weight:600;line-height:1.4;color:#262626;text-align:center;letter-spacing:2px;margin-bottom:4px}
.card-subtitle{font-size:12px;color:#a3a3a3;text-align:center;margin-bottom:24px}
.ornament{text-align:center;color:#d4a574;font-size:12px;margin:16px 0;letter-spacing:6px}
.divider--dashed{height:0;border:none;border-top:1px dashed #d4a574;margin:16px 0;opacity:.5}
.list-item{padding:12px 0;border-bottom:1px solid rgba(212,165,116,.2);font-size:14px;line-height:1.9;color:#404040}
.list-item:last-child{border-bottom:none}
.list-item .item-label{font-size:11px;color:#92400e;font-weight:600;margin-bottom:2px}
.quote{padding:12px 16px;margin:16px 0;border-left:2px solid #92400e;font-size:14px;color:#525252;line-height:1.9;background:rgba(146,64,14,.03);border-radius:0 6px 6px 0}
.highlight{padding:12px 16px;background:#fef3c7;border-radius:12px;font-size:12px;color:#92400e;line-height:1.7;margin:12px 0;text-align:center}
.seal{display:flex;align-items:center;justify-content:center;width:48px;height:48px;border:2px solid #92400e;border-radius:50%;color:#92400e;font-size:11px;font-weight:700;transform:rotate(-12deg);opacity:.5;margin:24px auto 0}
.signature{margin-top:16px;font-size:12px;color:#a3a3a3;text-align:center}
</style>
</head>
<body>
<div class="card">
  <h1 class="card-title">🏮 安寝前备忘</h1>
  <div class="card-subtitle">沈清殊为您准备的寝居检查清单</div>

  <div class="ornament">— 寝 前 诸 事 —</div>

  <div class="list-item">
    <div class="item-label">其一 · 炭火</div>
    炭火已燃至暗火，暖而不燥。臣亲手拨过三次，确认火星不会溅出。
  </div>
  <div class="list-item">
    <div class="item-label">其二 · 被褥</div>
    被褥已用内力烘热，去除了潮气。枕边放了您惯用的安神香囊。
  </div>
  <div class="list-item">
    <div class="item-label">其三 · 门窗</div>
    窗缝已用旧袍塞严，绝无漏风。门闩已落，外人不得入内。
  </div>
  <div class="list-item">
    <div class="item-label">其四 · 安神香</div>
    安神香炉已撤远三尺，防止熏到您。若仍觉气味过浓，臣即刻撤去。
  </div>

  <div class="divider--dashed"></div>

  <div class="quote">
    臣会安静守在枕边，保证不影响夫人睡眠。若夜间有任何不适，轻唤一声便好——臣一直都在。
  </div>

  <div class="highlight">
    夫人安寝，万事皆安。
  </div>

  <div class="seal">敬上</div>
  <div class="signature">—— 您的沈清殊</div>
</div>
</body>
</html>
