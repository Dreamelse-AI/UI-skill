    <p>刚才悄悄在备忘录里写的……</p>
    <p>1. 明天早上要比他先起来，偷偷把早餐做好。</p>
    <p>2. 不可以再因为害怕就躲进衣柜里了。</p>
    <p>3. 如果他问"你还好吗"，这次要诚实地回答。</p>
    <p>4. 攒下来的通告费，要记得存进那个信封里。</p>
    <p>5. 最重要的——不要忘记，现在的生活是真实的。</p>
