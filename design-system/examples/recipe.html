<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>食谱 - 草莓慕斯实验记录</title>
<link rel="stylesheet" href="../base.css">
<link rel="stylesheet" href="../templates/recipe.css">
</head>
<body class="tpl-recipe">
<div class="card">
  <h1 class="card-title">🍓 草莓慕斯实验记录</h1>
  <div class="card-subtitle">第58次配比实验 · 黎焰的绝密笔记</div>

  <div class="recipe-tags">
    <span class="recipe-tag">甜品</span>
    <span class="recipe-tag">草莓</span>
    <span class="recipe-tag">绝密</span>
  </div>

  <div class="divider"></div>

  <div style="font-size:12px;color:#a3a3a3;margin-bottom:8px;">材料清单</div>
  <div class="ingredient">
    <span class="ingredient-name">新鲜草莓</span>
    <span class="ingredient-amount">300g</span>
  </div>
  <div class="ingredient">
    <span class="ingredient-name">淡奶油</span>
    <span class="ingredient-amount">200ml</span>
  </div>
  <div class="ingredient">
    <span class="ingredient-name">吉利丁片</span>
    <span class="ingredient-amount">2片</span>
  </div>
  <div class="ingredient">
    <span class="ingredient-name">细砂糖</span>
    <span class="ingredient-amount">40g</span>
  </div>
  <div class="ingredient">
    <span class="ingredient-name">某人的耐心</span>
    <span class="ingredient-amount">∞</span>
  </div>

  <div class="divider"></div>

  <div style="font-size:12px;color:#a3a3a3;margin-bottom:8px;">制作步骤</div>
  <div class="step">
    <div class="step-num">1</div>
    <div class="step-text">草莓洗净去蒂，留3颗最好看的做装饰，其余打成泥。</div>
  </div>
  <div class="step">
    <div class="step-num">2</div>
    <div class="step-text">吉利丁片冷水泡软，隔水融化后拌入草莓泥。</div>
  </div>
  <div class="step">
    <div class="step-num">3</div>
    <div class="step-text">淡奶油加糖打至六分发，与草莓泥轻柔翻拌。</div>
  </div>
  <div class="step">
    <div class="step-num">4</div>
    <div class="step-text">倒入模具，冷藏4小时以上。</div>
  </div>

  <div class="recipe-tip">
    实验结论：比老街那家排队三小时的还要好吃。某人如果现在出门，还能赶上它口感最好的时候。
  </div>

  <div class="signature">—— 黎焰</div>
</div>
</body>
</html>
