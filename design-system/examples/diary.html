<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>日记 - 陆夏的碎碎念</title>
<link rel="stylesheet" href="../base.css">
<link rel="stylesheet" href="../templates/diary.css">
</head>
<body class="tpl-diary">
<div class="card">
  <div class="diary-date">
    <span class="day">18</span>
    四月 · 2026 · 周五
  </div>
  <div class="mood">😔 有点难过</div>
  <div class="card-body">
    <p>如果你看到刚才的我，一定会讨厌我的吧……</p>
    <p>明明说好了不哭的，可是一个人待在房间里的时候，眼泪就自己掉下来了。</p>
    <p>不是因为难过，是因为太开心了。</p>
    <p>以前从来没有人会在意我有没有吃饭，有没有睡好。</p>
    <div class="inner-voice">
      "如果这是梦的话，请让我晚一点醒来。"
    </div>
    <p>我把眼泪擦干净了，明天一定会笑着出门的。</p>
  </div>
  <div class="signature">—— 陆夏</div>
</div>
</body>
</html>
