<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:14px;-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;font-size:14px;line-height:1.7;color:#262626;background:linear-gradient(180deg,#fefcfb 0%,#fdf2f8 100%);overflow-x:hidden;word-break:break-all;overflow-wrap:break-word}
:root{--accent:#ec4899;--accent-light:#fdf2f8}
.card{position:relative;width:100%;max-width:420px;margin:0 auto;padding:24px 20px}
.card-title{font-size:17px;font-weight:600;line-height:1.4;color:#262626;margin-bottom:4px}
.card-subtitle{font-size:12px;color:#737373;margin-bottom:20px}
.divider{height:1px;background:#e8e8e8;margin:16px 0;border:none}
.photo-frame{background:#fff;border-radius:12px;padding:8px;box-shadow:0 2px 8px rgba(0,0,0,.06);margin-bottom:16px}
.photo-placeholder{width:100%;aspect-ratio:4/3;background:linear-gradient(135deg,#fce7f3 0%,#fdf2f8 50%,#ede9fe 100%);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:48px}
.photo-caption{font-size:11px;color:#a3a3a3;text-align:center;margin-top:8px;padding-bottom:4px}
.highlight{padding:12px 16px;background:var(--accent-light);border-radius:12px;font-size:12px;color:#db2777;line-height:1.7;margin:12px 0}
.tag-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.tag{display:inline-block;padding:2px 8px;font-size:11px;line-height:1.6;border-radius:999px;background:#fdf2f8;color:#db2777}
.quote{padding:12px 16px;margin:16px 0;border-left:2px solid var(--accent);font-size:12px;color:#737373;font-style:italic;line-height:1.7;background:rgba(236,72,153,.03);border-radius:0 6px 6px 0}
.info-row{display:flex;justify-content:space-between;padding:8px 0;font-size:12px;border-bottom:1px solid #f5f5f5}
.info-row:last-child{border-bottom:none}
.info-label{color:#737373}
.info-value{font-weight:500;color:#262626}
.signature{margin-top:24px;padding-top:16px;border-top:1px solid #e8e8e8;font-size:12px;color:#ec4899;text-align:right;font-style:italic;opacity:.6}
</style>
</head>
<body>
<div class="card">
  <h1 class="card-title">📸 仅你可见</h1>
  <div class="card-subtitle">一张略显局促的居家自拍照</div>

  <div class="photo-frame">
    <div class="photo-placeholder">🤳</div>
    <div class="photo-caption">2026.04.19 · 卧室 · 自拍第 23 次才选出来的</div>
  </div>

  <div class="tag-row">
    <span class="tag">素颜</span>
    <span class="tag">居家</span>
    <span class="tag">仅你可见</span>
  </div>

  <div class="info-row">
    <span class="info-label">拍摄次数</span>
    <span class="info-value">23 次</span>
  </div>
  <div class="info-row">
    <span class="info-label">删除次数</span>
    <span class="info-value">22 次</span>
  </div>
  <div class="info-row">
    <span class="info-label">犹豫要不要发</span>
    <span class="info-value">47 分钟</span>
  </div>

  <div class="divider"></div>

  <div class="highlight">
    穿的是你上次落在我这里的那件卫衣。太大了，袖子都盖过手指了……但是很暖和，而且有你的味道。
  </div>

  <div class="quote">
    "发完就后悔了，但是撤回的话你会看到'对方撤回了一条消息'，那更丢人……所以你就看吧。看完记得夸我。"
  </div>

  <div class="signature">—— 夏暮悠</div>
</div>
</body>
</html>
