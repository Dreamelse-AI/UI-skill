<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>公告 - 厨房禁区公告</title>
<link rel="stylesheet" href="../base.css">
<link rel="stylesheet" href="../templates/notice.css">
</head>
<body class="tpl-notice">
<div class="card">
  <div class="notice-bar">
    <span class="icon">⚠️</span>
    <span>紧急公告</span>
  </div>
  <h1 class="card-title">厨房禁区公告</h1>
  <div class="card-subtitle">关于今日早间发生的"甜品大爆炸"事件的非正式申明</div>
  <div class="divider"></div>
  <div class="clause">
    <span class="clause-num">1</span>
    即日起，厨房操作台半径1.5米内为绝对禁区，未经许可不得擅入。
  </div>
  <div class="clause">
    <span class="clause-num">2</span>
    所有甜品实验必须在本人监督下进行，禁止单独操作烤箱。
  </div>
  <div class="clause">
    <span class="clause-num">3</span>
    冰箱第二层为实验材料专用区，标注"请勿食用"的东西真的不能吃。
  </div>
  <div class="highlight-box">
    特别警告：再偷吃半成品草莓慕斯，后果自负。这不是威胁，这是承诺。
  </div>
  <div class="stamp">
    <div class="stamp-name">黎焰</div>
    <div>2026年4月18日</div>
  </div>
</div>
</body>
</html>
