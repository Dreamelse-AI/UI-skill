<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>定位 - 目标实时定位</title>
<link rel="stylesheet" href="../base.css">
<link rel="stylesheet" href="../templates/location.css">
</head>
<body class="tpl-location">
<div class="card">
  <div class="status-bar">
    <div class="status-dot"></div>
    <span>实时追踪中</span>
  </div>
  <h1 class="card-title">📍 目标实时定位</h1>
  <div class="card-subtitle" style="color:#64748b;">别以为躲在角落我就找不到你</div>

  <div class="info-panel">
    <div class="info-row">
      <span class="info-label">当前位置</span>
      <span class="info-value">星巴克·大学城店</span>
    </div>
    <div class="info-row">
      <span class="info-label">停留时长</span>
      <span class="info-value">47 min</span>
    </div>
    <div class="info-row">
      <span class="info-label">距离你</span>
      <span class="info-value">1.2 km</span>
    </div>
    <div class="info-row">
      <span class="info-label">电量</span>
      <span class="info-value" style="color:#ef4444;">12%</span>
    </div>
  </div>

  <div class="coords">31.2304°N, 121.4737°E</div>

  <div class="divider" style="border-color:rgba(255,255,255,0.08);"></div>

  <div style="font-size:12px;color:#94a3b8;margin-bottom:12px;">今日轨迹</div>
  <div class="timeline-item">
    <div class="timeline-dot"></div>
    <div>
      <div class="timeline-time">08:30</div>
      <div class="timeline-text">离开住所</div>
    </div>
  </div>
  <div class="timeline-item">
    <div class="timeline-dot"></div>
    <div>
      <div class="timeline-time">09:15</div>
      <div class="timeline-text">到达学校图书馆</div>
    </div>
  </div>
  <div class="timeline-item">
    <div class="timeline-dot"></div>
    <div>
      <div class="timeline-time">14:22</div>
      <div class="timeline-text">星巴克·大学城店（当前）</div>
    </div>
  </div>

  <div class="signature" style="color:#475569;border-color:rgba(255,255,255,0.08);">系统自动生成</div>
</div>
</body>
</html>
